# compose.swarm.yml
# -----------------
# Override to complement the original compose.yml for multi-node environments
# with .venv on a shared network volume (Scenario A).
#
# Startup flow:
# 1. plugin-installer starts, installs all requirements.txt with uv,
# exits with 0.
# 2. grinning-cat-core (N replicas) starts only after its exit 0.
# At startup, _install_requirements in plugin.py finds the libraries
# already present (--no-upgrade) and immediately returns without writing.
#
# Hot installation flow:
# 1. Worker A installs the plugin, updates its BillTheLizard,
# writes .plugin_refresh to cat/plugins (shared volume) with its
# pod_id.
# 2. The watcher on Worker B and Worker C detects the sentinel, verifies
# that the pod_id is not its own, runs discover_plugins() on
# its own BillTheLizard, and deletes the sentinel.
#
# Usage:
# docker compose -f compose.yml -f compose.swarm.yml up --scale grinning-cat-core=3

services:

  # --------------------------------------------------------------------------
  # Container init: Installs the requirements for all plugins before
  # worker startup. Does not depend on Redis or other application services.
  # -------------------------------------------------------------------------
  plugin-installer:
    build:
      context: .
      dockerfile: Dockerfile.installer
    container_name: grinning_cat_plugin_installer
    restart: "no"
    environment:
      CCAT_PLUGINS_PATH: /app/cat/plugins
      CCAT_VENV_PATH: /app/.venv
    volumes:
      - plugins_data:/app/cat/plugins       # same volumes of the workers, read-only
      - venv_shared:/app/.venv              # venv shared with workers
    networks:
      - cat-network

  # --------------------------------------------------------------------------
  # Worker: Starts only after plugin-installer has completed successfully.
  # The cat/plugins volume is already shared: the .plugin_refresh sentinel is
  # written and read on the same filesystem by all workers.
  # --------------------------------------------------------------------------
  grinning-cat-core:
    image: ghcr.io/matteocacciola/grinning-cat-core:latest
    volumes:
      - plugins_data:/app/cat/plugins       # plugins on shared volumes
      - venv_shared:/app/.venv              # shared venv, already populated by the installer
    depends_on:
      plugin-installer:
        condition: service_completed_successfully

volumes:
  plugins_data:
  venv_shared:

networks:
  cat-network:
    external: true
